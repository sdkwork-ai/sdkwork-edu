# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/edu/webserver.pid;
error_log /var/log/sdkwork/edu/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name edu-staging.sdkwork.com edu-staging.birdcoder.com edu-staging.dtupay.com edu-staging.noaper.com edu-staging.sdkwork.cn edu-staging.birdcoder.cn edu-staging.dtupay.cn edu-staging.noaper.cn edu-staging.skubc.com edu-staging.skubc.cn edu-staging.zowalk.com edu-staging.zowalk.cn edu-staging.offer86.com edu-staging.offer86.cn edu-staging.86offer.com edu-staging.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
