# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/edu/webserver.pid;
error_log /var/log/sdkwork/edu/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3910;
    }
    server {
        listen 80;
        server_name edu-demo.sdkwork.com edu-demo.birdcoder.com edu-demo.dtupay.com edu-demo.noaper.com edu-demo.sdkwork.cn edu-demo.birdcoder.cn edu-demo.dtupay.cn edu-demo.noaper.cn edu-demo.skubc.com edu-demo.skubc.cn edu-demo.zowalk.com edu-demo.zowalk.cn edu-demo.offer86.com edu-demo.offer86.cn edu-demo.86offer.com edu-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
