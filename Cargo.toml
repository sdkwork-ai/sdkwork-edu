[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-edu-assembly",
    "crates/sdkwork-api-edu-standalone-gateway",
    "crates/sdkwork-edu-database-host",
    "crates/sdkwork-edu-embedded-bootstrap",
    "crates/sdkwork-content-edu-service",
    "crates/sdkwork-content-edu-repository-sqlx",
    "crates/sdkwork-routes-edu-http-auth",
    "crates/sdkwork-routes-edu-app-api",
    "crates/sdkwork-routes-edu-backend-api",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline. Library crates forbid unsafe outright.
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
# Internal crates
sdkwork_content_edu_service = { path = "crates/sdkwork-content-edu-service", package = "sdkwork-content-edu-service" }
sdkwork_content_edu_repository_sqlx = { path = "crates/sdkwork-content-edu-repository-sqlx", package = "sdkwork-content-edu-repository-sqlx" }
sdkwork_routes_edu_http_auth = { path = "crates/sdkwork-routes-edu-http-auth", package = "sdkwork-routes-edu-http-auth" }
sdkwork_routes_edu_app_api = { path = "crates/sdkwork-routes-edu-app-api", package = "sdkwork-routes-edu-app-api" }
sdkwork_routes_edu_backend_api = { path = "crates/sdkwork-routes-edu-backend-api", package = "sdkwork-routes-edu-backend-api" }
sdkwork-api-edu-assembly = { path = "crates/sdkwork-api-edu-assembly" }
sdkwork-edu-database-host = { path = "crates/sdkwork-edu-database-host" }
sdkwork-edu-embedded-bootstrap = { path = "crates/sdkwork-edu-embedded-bootstrap" }
sdkwork-api-edu-standalone-gateway = { path = "crates/sdkwork-api-edu-standalone-gateway" }

# Platform frameworks (sibling checkouts; never forked)
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-iam-embedded-application-bootstrap = { path = "../sdkwork-iam/crates/sdkwork-iam-embedded-application-bootstrap", package = "sdkwork-iam-embedded-application-bootstrap" }
sdkwork-drive-uploader-service = { path = "../sdkwork-drive/crates/sdkwork-drive-uploader-service" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-drive-app-sdk-generated-rust = { path = "../sdkwork-drive/sdks/sdkwork-drive-app-sdk/sdkwork-drive-app-sdk-rust/generated/server-openapi", package = "sdkwork-drive-app-sdk-generated-rust" }

# Third-party
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"